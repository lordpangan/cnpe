apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app1-prd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/lordpangan/cnpe.git
    targetRevision: main
    path: argocd/app1/overlays/prd
  destination:
    server: https://kubernetes.default.svc
    namespace: prd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=false
